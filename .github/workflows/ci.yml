# CI — Internet Control meter
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: cargo test (Linux, platform-independent unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  check-windows:
    name: cargo check (Windows target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo check --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc -- -D warnings
