[package]
name = "internet-control"
version = "0.6.0"
edition = "2021"
description = "Internet Control — precise Windows internet usage meter (v0.6.0). Native egui UI (complete Rust, no WebView2/Edge), WinDivert intercept packet counting with per-app traffic, block/unblock while running (existing connections terminated at once), smoother rates, Minimal view with the live graph, dark/light theme."
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IP/TCP/UDP header parsing for per-app flow attribution (pure Rust,
# also used by the unit tests on Linux).
etherparse = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    # Gates MIB_IF_TABLE2 / GetIfTable2 / GetAdaptersAddresses inside
    # the IpHelper module (the if-table types live behind Ndis).
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# WinDivert 2.2 driver wrapper (stable 0.6.0; 0.7.x is beta). Needs the
# WinDivert 2.2.2 driver files at build time via WINDIVERT_PATH, and
# WinDivert.dll + WinDivert64.sys next to the exe at runtime.
windivert = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
# Embeds the requireAdministrator manifest (build.rs, Windows host only).
winres = "0.1"

[profile.release]
opt-level = 3
