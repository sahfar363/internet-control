[package]
name = "internet-control"
version = "0.1.0"
edition = "2021"
description = "Internet Control — precise Windows internet usage meter (v0.1). Lists all adapters, uses 64-bit counters polled every 100 ms, never double-counts VPN + tethering."
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
